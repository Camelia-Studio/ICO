name: Release

on:
  release:
    types: [published, edited]

jobs:
  build:
    name: Build release ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_sqlite, pdo_mysql, pdo_pgsql, zip
          coverage: none
      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends unzip git ca-certificates curl zip


      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress --no-interaction

      - name: Build ZIP
        run: |
          ZIP_NAME="ico-${GITHUB_REF_NAME}.zip"
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(tr -d '[:space:]' < version.txt)"

          if [ "${PROJECT_VERSION}" != "${RELEASE_VERSION}" ]; then
            echo "version.txt (${PROJECT_VERSION}) must match release tag (${RELEASE_VERSION})."
            exit 1
          fi

          mkdir -p staging/ico

          cp -r public routes src js css vendor staging/ico/
          cp favicon.png .htaccess staging/ico/
          cp init-db.php version.txt README.md LICENSE composer.json composer.lock staging/ico/
          cp vestikan-sdk.php vestikan-config.sample.php staging/ico/

          mkdir -p staging/ico/img_carrousel staging/ico/liste_albums staging/ico/liste_albums_prives
          cp img_carrousel/infos.txt staging/ico/img_carrousel/
          cp liste_albums/infos.txt staging/ico/liste_albums/
          cp liste_albums_prives/infos.txt staging/ico/liste_albums_prives/

          (cd staging && zip -r "../${ZIP_NAME}" ico/)

          forbidden_files=$(unzip -l "${ZIP_NAME}" | awk '{print $4}' | grep -E '^ico/(config\.txt|database\.sqlite|vestikan-config\.php)$' || true)
          if [ -n "${forbidden_files}" ]; then
            echo "Release ZIP must not include mutable installation files:"
            echo "${forbidden_files}"
            exit 1
          fi

          echo "ZIP_NAME=${ZIP_NAME}" >> "${GITHUB_ENV}"

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ico-${{ github.ref_name }}
          path: "*.zip"
          retention-days: 30

      - name: Publish on release
        uses: softprops/action-gh-release@v1
        with:
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
